<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bahia Go – تطبيق الحافلات والتاكسي</title>
<style>
:root{--bg:#0b0f1a;--card:#141a2b;--text:#ffffff;--muted:#a9b4cc;--blue:#2f7bff;--border:#26304a;--grad:linear-gradient(135deg,#ffb020 0%,#ff4fa3 55%,#8a4dff 100%);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0f1a;--card:#141a2b;--text:#ffffff;--muted:#a9b4cc;--border:#26304a}}
:root[data-theme="dark"]{--bg:#0b0f1a;--card:#141a2b;--text:#ffffff;--muted:#a9b4cc;--border:#26304a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(circle at 50% -10%,#2a1a4d 0%,var(--bg) 55%);background-color:var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;line-height:1.7;min-height:100vh}
main{max-width:520px;margin:0 auto;padding:30px 18px 40px;text-align:center}
.icon{width:150px;height:150px;margin:0 auto 14px;border-radius:34px;display:block;box-shadow:0 10px 40px rgba(255,79,163,.35)}
h1{margin:0 0 6px;font-size:30px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);margin:0 0 24px}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:20px;margin-bottom:16px}
.btn{display:block;padding:15px 18px;border-radius:14px;font-size:17px;font-weight:700;text-decoration:none;margin-top:12px}
.primary{background:var(--grad);color:#fff;box-shadow:0 6px 20px rgba(255,79,163,.35)}
.secondary{background:transparent;color:#6ea5ff;border:1.5px solid var(--blue)}
.card h2{margin:0 0 6px;font-size:18px;color:#ffb020}
.card p{margin:0;color:var(--muted);font-size:15px}
.steps{text-align:right;padding-inline-start:20px;margin:8px 0 0;color:var(--muted);font-size:15px}
.meta{color:var(--muted);font-size:13px;margin-top:18px}
</style>
